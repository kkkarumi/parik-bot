services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD:-app}@db:5432/app
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://backend:8000
    depends_on: [backend]

volumes:
  pgdata:
