# Один салон = одна папка с этим проектом и своим .env.
# Запуск: ./setup.sh (первый раз) или docker compose up -d --build (обновление).

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }   # логи не съедят диск VPS

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?впишите DB_PASSWORD в .env}
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/app
    depends_on: { db: { condition: service_healthy } }
    # порт наружу не открываем: бот ходит в API по внутренней сети докера
    logging: *logging

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://backend:8000
      BOT_STATE_FILE: /data/state.pickle   # незаконченные записи переживут перезапуск
    volumes: [botdata:/data]
    depends_on: { backend: { condition: service_healthy } }
    logging: *logging

volumes:
  pgdata:
  botdata:
